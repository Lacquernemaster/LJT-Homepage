name: Render Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check rendered output
        run: |
          echo "===== HOME PAGE ====="
          grep -o "Junteng Liu" _site/index.html | head -3
          grep -o "SynLogic[^<]*" _site/index.html | head -1
          grep -o "jliugi@connect.ust.hk" _site/index.html | head -1
          echo "===== PUBLICATIONS PAGE ====="
          grep -o "SynLogic[^<]*" _site/publications/index.html | head -1
          grep -o "C-Eval[^<]*" _site/publications/index.html | head -1
          grep -o "On the Universal Truthfulness Hyperplane Inside LLMs" _site/publications/index.html | head -1
